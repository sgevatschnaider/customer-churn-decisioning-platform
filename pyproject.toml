[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-decisioning-platform"
version = "1.0.0"
description = "Production-oriented customer churn prediction and economic decisioning platform."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Sergio Gevatschnaider" }]
dependencies = [
  "fastapi==0.115.6",
  "joblib==1.4.2",
  "matplotlib==3.9.2",
  "mlflow==2.19.0",
  "numpy==2.1.3",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "psycopg2-binary==2.9.10",
  "PyYAML==6.0.2",
  "scikit-learn==1.9.0",
  "scipy==1.14.1",
  "tabulate==0.9.0",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pre-commit==4.0.1",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.8.6",
]
orchestration = ["apache-airflow==2.10.5"]

[project.scripts]
churn-platform = "churn_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=churn_platform --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = [
  "integration: integration tests that exercise multiple components",
]

[tool.coverage.run]
branch = true
omit = [
  "src/churn_platform/cli.py",
  "src/churn_platform/logging.py",
]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "except ImportError:",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"dags/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
