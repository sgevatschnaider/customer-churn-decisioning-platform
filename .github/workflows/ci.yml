name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Unit and integration tests with coverage
        run: python -m pytest --basetemp="${RUNNER_TEMP}/pytest" --cov-report=xml
      - name: Fixture pipeline smoke test
        run: python -m churn_platform.cli pipeline --source fixture
      - name: API import check
        run: python -c "from churn_platform.api.main import app; assert app.title"
      - name: DAG structure check
        run: python -c "from dags.churn_pipeline import TASK_IDS; assert len(TASK_IDS) == 11"
      - name: Docker Compose configuration check
        run: docker compose config
      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Docker Compose
        run: docker compose config
      - name: Build API image
        run: docker build --tag churn-platform-api:ci .
      - name: Build Airflow image
        run: docker build --file Dockerfile.airflow --tag churn-platform-airflow:ci .
      - name: Import the real DAG with Airflow installed
        run: |
          docker run --rm churn-platform-airflow:ci python -c \
            "from airflow.models import DagBag; bag=DagBag('/opt/airflow/dags', include_examples=False); assert not bag.import_errors, bag.import_errors; dag=bag.dags['customer_churn_decisioning_pipeline']; assert len(dag.task_ids) == 11"
      - name: Verify degraded API container
        run: |
          docker run --detach --name churn-api-degraded --publish 8001:8000 churn-platform-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8001/health/live > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8001/health/live
          test "$(curl --silent --output /tmp/degraded.json --write-out '%{http_code}' http://localhost:8001/health/ready)" = "503"
          grep --quiet 'degraded' /tmp/degraded.json
          docker rm --force churn-api-degraded
      - name: Build a fixture model and verify ready API container
        run: |
          docker run --detach --name churn-api-ready --publish 8002:8000 \
            --entrypoint sh churn-platform-api:ci -c \
            "python -m churn_platform.cli pipeline --source fixture && exec uvicorn churn_platform.api.main:app --host 0.0.0.0 --port 8000"
          for attempt in $(seq 1 90); do
            status=$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://localhost:8002/health/ready || true)
            if [ "$status" = "200" ]; then break; fi
            sleep 2
          done
          test "$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://localhost:8002/health/ready)" = "200"
          grep --quiet 'ready' /tmp/ready.json
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          payload = {
              "customer_id": "EXAMPLE-001",
              "recency_days": 45,
              "purchase_frequency": 1.2,
              "monetary_value": 1200,
              "average_order_value": 100,
              "customer_tenure_days": 180,
              "number_of_invoices": 12,
              "number_of_unique_products": 20,
              "purchase_regularity_days": 8,
              "recent_purchasing_trend": -0.2,
              "cancellation_rate": 0.05,
              "quantity_purchased": 60,
              "geographic_segment": "Europe",
              "recent_spend": 200,
              "historical_spend": 400,
              "spend_change_ratio": 0.5,
              "recent_invoice_count": 2,
              "historical_invoice_count": 4,
              "frequency_change_ratio": 0.6,
          }

          def post(path: str) -> dict[str, object]:
              request = Request(
                  f"http://localhost:8002{path}",
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urlopen(request, timeout=30) as response:
                  assert response.status == 200, (path, response.status)
                  return json.load(response)

          prediction = post("/predict")
          churn_probability = prediction.get("churn_probability")
          assert isinstance(churn_probability, (int, float))
          assert not isinstance(churn_probability, bool)
          assert 0 <= churn_probability <= 1

          decision = post("/decision")
          required_fields = {
              "expected_net_value",
              "economic_eligibility",
              "portfolio_selection_notice",
          }
          assert required_fields <= decision.keys(), required_fields - decision.keys()
          assert isinstance(decision["expected_net_value"], (int, float))
          assert isinstance(decision["economic_eligibility"], bool)
          assert decision["portfolio_selection_notice"]
          assert "recommended_action" not in decision
          PY
          docker rm --force churn-api-ready
      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs churn-api-degraded 2>/dev/null || true
          docker logs churn-api-ready 2>/dev/null || true
      - name: Clean up containers
        if: always()
        run: |
          docker rm --force churn-api-degraded 2>/dev/null || true
          docker rm --force churn-api-ready 2>/dev/null || true
