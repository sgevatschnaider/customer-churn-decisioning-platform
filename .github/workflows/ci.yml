name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Unit and integration tests with coverage
        run: python -m pytest --cov-report=xml
      - name: Fixture pipeline smoke test
        run: python -m churn_platform.cli pipeline --source fixture
      - name: API import check
        run: python -c "from churn_platform.api.main import app; assert app.title"
      - name: DAG structure check
        run: python -c "from dags.churn_pipeline import TASK_IDS; assert len(TASK_IDS) == 11"
      - name: Docker Compose configuration check
        run: docker compose config
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
