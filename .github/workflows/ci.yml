name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Unit and integration tests with coverage
        run: python -m pytest --cov-report=xml
      - name: Fixture pipeline smoke test
        run: python -m churn_platform.cli pipeline --source fixture
      - name: API import check
        run: python -c "from churn_platform.api.main import app; assert app.title"
      - name: DAG structure check
        run: python -c "from dags.churn_pipeline import TASK_IDS; assert len(TASK_IDS) == 11"
      - name: Docker Compose configuration check
        run: docker compose config
      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
