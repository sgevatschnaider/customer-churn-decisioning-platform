name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Unit and integration tests with coverage
        run: python -m pytest --cov-report=xml
      - name: Fixture pipeline smoke test
        run: python -m churn_platform.cli pipeline --source fixture
      - name: API import check
        run: python -c "from churn_platform.api.main import app; assert app.title"
      - name: DAG structure check
        run: python -c "from dags.churn_pipeline import TASK_IDS; assert len(TASK_IDS) == 11"
      - name: Docker Compose configuration check
        run: docker compose config
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
